<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Real Spanish for construction and welding crews — safety, tools, and jobsite talk.">
<title>Jobsite Spanish</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<meta name="theme-color" content="#FFD100">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0a0a0a;
  --ink-soft: #2e2e2e;
  --muted: #6b6b6b;
  --paper: #ffffff;
  --paper-2: #f2f2f2;
  --steel: #1a1a1a;
  --steel-deep: #000000;
  --blaze: #ffd100;
  --blaze-deep: #e6b800;
  --warn: #ffe566;
  --ok: #1a7a4c;
  --bad: #c1121f;
  --line: rgba(10, 10, 10, 0.14);
  --shadow: 0 12px 28px rgba(10, 10, 10, 0.12);
  --radius: 14px;
  --nav-h: 76px;
  --font-display: "Bebas Neue", Impact, sans-serif;
  --font-body: "Manrope", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(ellipse 120% 80% at 10% -10%, rgba(255, 209, 0, 0.28), transparent 55%),
    radial-gradient(ellipse 90% 60% at 100% 0%, rgba(10, 10, 10, 0.06), transparent 50%),
    linear-gradient(180deg, #ffffff 0%, var(--paper) 45%, #f0f0f0 100%);
  min-height: 100dvh;
  padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 0;
}
.app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; }

/* —— Header / brand —— */
.top {
  padding: 20px 18px 10px;
  animation: rise 0.55s ease both;
}
.brand-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  object-fit: cover;
  border: 2px solid var(--ink);
  box-shadow: 4px 4px 0 var(--blaze);
  flex-shrink: 0;
}
.brand-text h1 {
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 9vw, 3.1rem);
  letter-spacing: 0.03em;
  line-height: 0.9;
  color: var(--ink);
}
.brand-text h1 em {
  font-style: normal;
  color: var(--blaze);
}
.tagline {
  margin-top: 4px;
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--ink-soft);
}
.search-wrap {
  margin-top: 16px;
  position: relative;
}
.search-wrap input {
  width: 100%;
  padding: 14px 16px 14px 44px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: rgba(255,255,255,0.72);
  font: inherit;
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}
.search-wrap input:focus {
  border-color: var(--blaze);
  box-shadow: 0 0 0 3px rgba(255, 209, 0, 0.45);
}
.search-wrap .mag {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  border: 2px solid var(--muted);
  border-radius: 50%;
  pointer-events: none;
}
.search-wrap .mag::after {
  content: "";
  position: absolute;
  width: 8px;
  height: 2px;
  background: var(--muted);
  right: -5px;
  bottom: -1px;
  transform: rotate(45deg);
}

/* —— Category rail —— */
.rail {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 18px 4px;
  scrollbar-width: none;
}
.rail::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  border: 2px solid var(--ink);
  background: rgba(255,255,255,0.55);
  color: var(--ink);
  font: inherit;
  font-weight: 700;
  font-size: 0.82rem;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.12s, background 0.12s, color 0.12s;
}
.chip:active { transform: scale(0.96); }
.chip.on {
  background: var(--ink);
  color: var(--blaze);
}

/* —— Main —— */
main { padding: 12px 18px 24px; }
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 8px 0 14px;
}
.section-head h2 {
  font-family: var(--font-display);
  font-size: 1.7rem;
  letter-spacing: 0.04em;
}
.section-head span {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.cat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 22px;
}
.cat-btn.wide {
  grid-column: 1 / -1;
}
.cat-btn {
  text-align: left;
  border: 2px solid var(--ink);
  background: rgba(255,255,255,0.65);
  border-radius: var(--radius);
  padding: 16px 14px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  animation: rise 0.5s ease both;
}
.cat-btn:nth-child(1) { animation-delay: 0.04s; }
.cat-btn:nth-child(2) { animation-delay: 0.08s; }
.cat-btn:nth-child(3) { animation-delay: 0.12s; }
.cat-btn:nth-child(4) { animation-delay: 0.16s; }
.cat-btn:nth-child(5) { animation-delay: 0.2s; }
.cat-btn:nth-child(6) { animation-delay: 0.24s; }
.cat-btn:nth-child(7) { animation-delay: 0.28s; }
.cat-btn:nth-child(8) { animation-delay: 0.32s; }
.cat-btn:nth-child(9) { animation-delay: 0.36s; }
.cat-btn:hover {
  transform: translateY(-2px);
  box-shadow: 4px 4px 0 var(--blaze);
}
.cat-btn:active { transform: translateY(0); box-shadow: none; }
.cat-btn .mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--blaze);
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: 0.02em;
  margin-bottom: 10px;
}
.cat-btn h3 {
  font-size: 1rem;
  font-weight: 800;
  margin-bottom: 2px;
}
.cat-btn p {
  font-size: 0.78rem;
  color: var(--muted);
  font-weight: 500;
}

.phrase-list { display: flex; flex-direction: column; gap: 10px; }
.phrase {
  border: 2px solid var(--ink);
  background: rgba(255,255,255,0.78);
  border-radius: var(--radius);
  padding: 14px 14px 14px 16px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  align-items: center;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s;
  animation: rise 0.4s ease both;
}
.phrase:active { transform: scale(0.985); }
.phrase.known {
  border-color: var(--ok);
  background: rgba(26, 122, 76, 0.1);
}
.phrase .es {
  font-size: 1.12rem;
  font-weight: 800;
  grid-column: 1;
}
.phrase .en {
  grid-column: 1;
  color: var(--ink-soft);
  font-size: 0.92rem;
  font-weight: 500;
}
.phrase .meta {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.tip {
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 600;
}
.badge {
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 7px;
  border-radius: 6px;
  background: var(--paper-2);
  border: 1px solid var(--line);
}
.badge.mine { background: #fff6bf; border-color: var(--ink); color: var(--ink); }
.badge.hot { background: var(--ink); color: var(--blaze); }
.actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  background: var(--blaze);
  color: var(--ink);
  font-size: 0.75rem;
  font-weight: 800;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: transform 0.12s, background 0.12s;
}
.icon-btn:active { transform: scale(0.9); }
.icon-btn.ghost {
  background: transparent;
  color: var(--ink);
}
.icon-btn.ghost.on {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
}

.empty {
  text-align: center;
  padding: 40px 16px;
  border: 2px dashed var(--ink);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.4);
}
.empty h3 {
  font-family: var(--font-display);
  font-size: 1.8rem;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.empty p { color: var(--muted); font-weight: 600; }

/* —— Panels —— */
.panel {
  border: 2px solid var(--ink);
  background: rgba(255,255,255,0.82);
  border-radius: 18px;
  padding: 22px 18px;
  box-shadow: 6px 6px 0 var(--steel);
  animation: rise 0.45s ease both;
}
.panel.blaze {
  background: linear-gradient(160deg, #fffce6, #ffe566);
  box-shadow: 6px 6px 0 var(--ink);
}
.panel h2 {
  font-family: var(--font-display);
  font-size: 2rem;
  letter-spacing: 0.04em;
  line-height: 1;
  margin-bottom: 6px;
}
.panel .lead {
  color: var(--ink-soft);
  font-weight: 600;
  margin-bottom: 16px;
}
label {
  display: block;
  font-size: 0.75rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin: 12px 0 6px;
}
input[type="text"], select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--ink);
  border-radius: 12px;
  background: #fff;
  font: inherit;
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  outline: none;
}
textarea { resize: vertical; min-height: 88px; }
input:focus, select:focus, textarea:focus {
  border-color: var(--blaze);
  box-shadow: 0 0 0 3px rgba(255, 209, 0, 0.4);
}
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn {
  border: 2px solid var(--ink);
  background: var(--blaze);
  color: var(--ink);
  font: inherit;
  font-weight: 800;
  font-size: 0.95rem;
  padding: 12px 18px;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s;
}
.btn:hover { box-shadow: 3px 3px 0 var(--ink); transform: translateY(-1px); }
.btn:active { transform: none; box-shadow: none; }
.btn.steel { background: var(--ink); color: var(--blaze); }
.btn.ghost { background: transparent; color: var(--ink); }
.status {
  margin-top: 12px;
  font-weight: 700;
  min-height: 1.2em;
}
.status.ok { color: var(--ok); }
.status.bad { color: var(--bad); }

/* —— Quiz —— */
.quiz-prompt {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 7vw, 2.4rem);
  letter-spacing: 0.03em;
  line-height: 1.05;
  margin: 18px 0 8px;
  min-height: 2.2em;
}
.quiz-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}
.track {
  height: 8px;
  background: var(--paper-2);
  border: 2px solid var(--ink);
  border-radius: 999px;
  overflow: hidden;
  margin: 10px 0 4px;
}
.track > i {
  display: block;
  height: 100%;
  background: var(--blaze);
  width: 0%;
  transition: width 0.35s ease;
}
.options { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.option {
  text-align: left;
  border: 2px solid var(--ink);
  background: #fff;
  border-radius: 12px;
  padding: 14px 16px;
  font: inherit;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.12s, background 0.15s, border-color 0.15s;
}
.option:hover:not(:disabled) { transform: translateX(3px); }
.option:disabled {
  opacity: 1;
  color: var(--ink);
}
.option.correct {
  background: rgba(26, 122, 76, 0.18);
  border-color: var(--ok);
  animation: pop 0.35s ease;
}
.option.wrong {
  background: rgba(193, 18, 31, 0.12);
  border-color: var(--bad);
  animation: shake 0.35s ease;
}
.score-big {
  font-family: var(--font-display);
  font-size: 4rem;
  letter-spacing: 0.04em;
  line-height: 1;
  color: var(--blaze);
  margin: 12px 0;
}
.streak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  color: var(--ink);
  background: var(--blaze);
  border: 2px solid var(--ink);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.85rem;
}

/* —— Progress —— */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 16px 0;
}
.stat {
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 14px;
  background: #fff;
}
.stat b {
  display: block;
  font-family: var(--font-display);
  font-size: 2.2rem;
  letter-spacing: 0.03em;
  line-height: 1;
  color: var(--blaze);
}
.stat span {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* —— Bottom nav —— */
.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(10px);
  border-top: 2px solid var(--ink);
  display: flex;
  justify-content: space-around;
  padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
  max-width: 520px;
  margin: 0 auto;
}
.nav-btn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 6px 2px;
}
.nav-btn .glyph {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 1rem;
  letter-spacing: 0;
  border: 2px solid transparent;
  transition: all 0.15s;
}
.nav-btn.on { color: var(--ink); }
.nav-btn.on .glyph {
  background: var(--blaze);
  color: var(--ink);
  border-color: var(--ink);
  transform: translateY(-2px);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + 12px);
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--blaze);
  padding: 10px 16px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 80;
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.speak-pulse {
  animation: pulse 0.45s ease;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
@keyframes pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.03); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
@keyframes pulse {
  0% { transform: scale(1); }
  40% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

@media (min-width: 600px) {
  .cat-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand-row">
      <img src="icon.png" alt="" class="logo" width="56" height="56">
      <div class="brand-text">
        <h1>JOBSITE <em>SPANISH</em></h1>
        <p class="tagline">Talk like the crew. Not like a textbook.</p>
      </div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <span class="mag" aria-hidden="true"></span>
      <input type="search" id="search" placeholder="Search phrases, tools, slang…" autocomplete="off" enterkeyhint="search">
    </div>
  </header>

  <nav class="rail" id="categoryTabs" aria-label="Categories"></nav>
  <main id="mainContent"></main>
</div>

<nav class="bottom-nav" aria-label="Primary">
  <button class="nav-btn on" data-view="home"><span class="glyph">JS</span>Home</button>
  <button class="nav-btn" data-view="quiz"><span class="glyph">QZ</span>Drill</button>
  <button class="nav-btn" data-view="add"><span class="glyph">+</span>Add</button>
  <button class="nav-btn" data-view="interpreter"><span class="glyph">SP</span>Speak</button>
  <button class="nav-btn" data-view="progress"><span class="glyph">XP</span>Stats</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
const builtInPhrases = [
  // Safety — blunt & useful
  { cat: "Safety", es: "¡Cuidado!", en: "Watch out!", tip: "Yell it. Don't whisper it." },

  { cat: "Safety", es: "Ponte el casco.", en: "Put on your hard hat.", tip: "No hat, no work" },
  { cat: "Safety", es: "Usa las gafas.", en: "Wear your safety glasses.", tip: "Short form crews use" },

  { cat: "Safety", es: "Se requiere EPP siempre.", en: "PPE required at all times.", tip: "Equipo de protección personal" },
  { cat: "Safety", es: "Aléjate de la máquina.", en: "Get away from the machine.", tip: "Equipment swing radius" },
  { cat: "Safety", es: "No toques eso.", en: "Don't touch that.", tip: "Hot, sharp, or live" },

  { cat: "Safety", es: "Hay un hueco abierto.", en: "There's an open hole.", tip: "Cover / barricade it" },
  { cat: "Safety", es: "No camines por ahí.", en: "Don't walk over there.", tip: "Keep people out of the zone" },

  // Tools
  { cat: "Tools", es: "el martillo", en: "hammer", tip: "Basic" },
  { cat: "Tools", es: "el taladro", en: "drill", tip: "Power tool" },
  { cat: "Tools", es: "la amoladora", en: "angle grinder", tip: "Sparks flying = this" },
  { cat: "Tools", es: "la sierra circular", en: "circular saw", tip: "Cutting" },
  { cat: "Tools", es: "la cinta métrica", en: "tape measure", tip: "Measure twice" },
  { cat: "Tools", es: "el nivel", en: "level", tip: "Is it plumb?" },
  { cat: "Tools", es: "la escalera", en: "ladder", tip: "3-point contact" },
  { cat: "Tools", es: "el andamio", en: "scaffold", tip: "Elevated work" },
  { cat: "Tools", es: "la llave inglesa", en: "adjustable wrench", tip: "Also just 'la llave'" },
  { cat: "Tools", es: "los alicates", en: "pliers", tip: "Hand tool" },
  { cat: "Tools", es: "el destornillador", en: "screwdriver", tip: "Also 'desarmador'" },
  { cat: "Tools", es: "la pala", en: "shovel", tip: "Dig" },

function safeParse(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key) || "null");
    return v == null ? fallback : v;
  } catch {
    return fallback;
  }
}

function phraseId(p) {
  return `${p.cat}::${p.es}::${p.en}`;
}

function getAllPhrases() {
  return [
    ...builtInPhrases.map(p => ({ ...p, custom: false })),
    ...customPhrases.map(p => ({ ...p, custom: true }))
  ];
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1800);
}

function speak(text, lang = "es-MX") {
  if (!("speechSynthesis" in window)) {
    toast("Speech not supported on this device");
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.88;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function persistKnown() {
  localStorage.setItem("knownIds", JSON.stringify([...knownIds]));
}

function toggleKnown(id) {
  if (knownIds.has(id)) knownIds.delete(id);
  else knownIds.add(id);
  persistKnown();
}

function renderTabs() {
  if (currentView !== "home") {
    tabs.style.display = "none";
    tabs.innerHTML = "";
    return;
  }
  tabs.style.display = "";
  const items = [{ id: "all", name: "All" }, ...categories];
  tabs.innerHTML = items.map(c =>
    `<button type="button" class="chip ${currentCat === c.id ? "on" : ""}" data-cat="${escapeHtml(c.id)}">${escapeHtml(c.name)}</button>`
  ).join("");
  tabs.querySelectorAll(".chip").forEach(t => {
    t.onclick = () => {
      currentCat = t.dataset.cat;
      render();
    };
  });
}

function phraseCard(p, i) {
  const id = phraseId(p);
  const known = knownIds.has(id);
  const badges = [
    p.custom ? `<span class="badge mine">Mine</span>` : "",
    i < 3 && currentCat === "all" ? `<span class="badge hot">Hot</span>` : ""
  ].join("");
  return `
    <article class="phrase ${known ? "known" : ""}" data-id="${escapeHtml(id)}" style="animation-delay:${Math.min(i, 8) * 0.04}s">
      <div class="es">${escapeHtml(p.es)}</div>
      <div class="actions">
        <button type="button" class="icon-btn play" data-text="${escapeHtml(p.es)}" aria-label="Play Spanish">SAY</button>
        <button type="button" class="icon-btn ghost mark ${known ? "on" : ""}" data-id="${escapeHtml(id)}" aria-label="Mark known">${known ? "GOT" : "GOT?"}</button>
      </div>
      <div class="en">${escapeHtml(p.en)}</div>
      <div class="meta">
        ${badges}
        ${p.tip ? `<span class="tip">${escapeHtml(p.tip)}</span>` : ""}
      </div>
    </article>
  `;
}

function attachPhraseHandlers(root = main) {
  root.querySelectorAll(".play").forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      b.classList.remove("speak-pulse");
      void b.offsetWidth;
      b.classList.add("speak-pulse");
      speak(b.dataset.text);
    };
  });
  root.querySelectorAll(".mark").forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      toggleKnown(b.dataset.id);
      toast(knownIds.has(b.dataset.id) ? "Marked as known" : "Unmarked");
      if (currentView === "home") renderHome();
      else renderProgress();
    };
  });
}

function filteredPhrases() {
  const all = getAllPhrases();
  let list = currentCat === "all" ? all
    : currentCat === "Custom" ? all.filter(p => p.custom)
    : all.filter(p => p.cat === currentCat);
  const q = searchEl.value.trim().toLowerCase();
  if (q) {
    list = list.filter(p =>
      p.es.toLowerCase().includes(q) ||
      p.en.toLowerCase().includes(q) ||
      (p.cat || "").toLowerCase().includes(q) ||
      (p.tip || "").toLowerCase().includes(q)
    );
  }
  return list;
}

function renderHome() {
  searchWrap.style.display = "";
  const all = getAllPhrases();
  const results = filteredPhrases();
  const searching = searchEl.value.trim().length > 0;

  if (currentCat === "all" && !searching) {
    const popular = all.slice(0, 8);
    main.innerHTML = `

    `;

function saveCustomPhrase() {
  const es = document.getElementById("newEs").value.trim();
  const en = document.getElementById("newEn").value.trim();

  const tip = document.getElementById("newTip").value.trim();

  if (!es || !en) {
    status.textContent = "Need both Spanish and English.";
    status.className = "status bad";
    return;
  }
  customPhrases.push({ cat, es, en, tip: tip || undefined });
  localStorage.setItem("customPhrases", JSON.stringify(customPhrases));
  status.textContent = "Locked in. It'll show up in Drill.";
  status.className = "status ok";
  document.getElementById("newEs").value = "";
  document.getElementById("newEn").value = "";
  document.getElementById("newTip").value = "";

function speakInterp(lang) {
  const text = document.getElementById("interpText").value.trim();
  if (!text) {
    toast("Type something first");
    return;
  }
  speak(text, lang === "es" ? "es-MX" : "en-US");
  if (lang === "es" && !document.getElementById("interpEs").value) {
    document.getElementById("interpEs").value = text;
  }
  if (lang === "en" && !document.getElementById("interpEn").value) {
    document.getElementById("interpEn").value = text;
  }
}

function saveFromInterpreter() {
  const es = document.getElementById("interpEs").value.trim();
  const en = document.getElementById("interpEn").value.trim();
  const cat = document.getElementById("interpCat").value;

  if (!es || !en) {
    status.textContent = "Need Spanish and English to save.";
    status.className = "status bad";
    return;

  customPhrases.push({ cat, es, en });
  localStorage.setItem("customPhrases", JSON.stringify(customPhrases));

function startQuiz() {
  searchWrap.style.display = "none";
  const all = getAllPhrases();
  if (all.length < 4) {
    main.innerHTML = `<div class="empty"><h3>Need more phrases</h3><p>Add a few before running Drill.</p></div>`;
    return;
  }
  quizQuestions = [...all].sort(() => Math.random() - 0.5).slice(0, Math.min(10, all.length));
  quizIndex = 0;
  quizScore = 0;
  quizStreak = 0;
  showQuestion();
}

function pickLine(bucket) {
  return bucket[Math.floor(Math.random() * bucket.length)];
}

function showQuestion() {
  if (quizIndex >= quizQuestions.length) {
    if (quizScore > bestScore) {
      bestScore = quizScore;
      localStorage.setItem("bestScore", String(bestScore));
    }
    const ratio = quizScore / quizQuestions.length;
    const line = ratio >= 0.8 ? pickLine(QUIZ_LINES.win)
      : ratio >= 0.5 ? pickLine(QUIZ_LINES.mid)
      : pickLine(QUIZ_LINES.low);
    main.innerHTML = `
      <div class="panel blaze" style="text-align:center;">
        <h2>Shift over</h2>
        <div class="score-big">${quizScore}/${quizQuestions.length}</div>
        <p class="lead">${escapeHtml(line)}</p>
        ${streakBest ? `<p class="streak">Best streak: ${streakBest}</p>` : ""}
        <div class="btn-row" style="justify-content:center;">
          <button type="button" class="btn" id="retryQuiz">Run it back</button>
          <button type="button" class="btn ghost" id="homeAfterQuiz">Home</button>
        </div>
      </div>
    `;
    document.getElementById("retryQuiz").onclick = startQuiz;
    document.getElementById("homeAfterQuiz").onclick = () => {
      currentView = "home";
      document.querySelectorAll(".nav-btn").forEach(x => x.classList.toggle("on", x.dataset.view === "home"));
      render();
    };
    return;
  }

  const q = quizQuestions[quizIndex];
  const all = getAllPhrases();
  const options = [q.en];
  let guard = 0;
  while (options.length < 4 && guard++ < 80) {
    const rand = all[Math.floor(Math.random() * all.length)].en;
    if (!options.includes(rand)) options.push(rand);
  }
  options.sort(() => Math.random() - 0.5);

  main.innerHTML = `
    <div class="panel">
      <div class="quiz-meta">
        <span>Q ${quizIndex + 1} / ${quizQuestions.length}</span>
        <span>${quizStreak ? `Streak ${quizStreak}` : "No streak yet"}</span>
      </div>
      <div class="track"><i style="width:${(quizIndex / quizQuestions.length) * 100}%"></i></div>
      <div class="quiz-prompt">${escapeHtml(q.es)}</div>
      <p class="lead" style="margin-bottom:0;">What does it mean?</p>
      <div class="options">
        ${options.map(o =>
          `<button type="button" class="option" data-correct="${o === q.en}">${escapeHtml(o)}</button>`
        ).join("")}
      </div>
      <div class="btn-row">
        <button type="button" class="btn ghost" id="hearQ">Hear it</button>
      </div>
    </div>
  `;
  document.getElementById("hearQ").onclick = () => speak(q.es);
  document.querySelectorAll(".option").forEach(opt => {
    opt.onclick = () => {
      document.querySelectorAll(".option").forEach(o => { o.disabled = true; });
      const correct = opt.dataset.correct === "true";
      if (correct) {
        opt.classList.add("correct");
        quizScore++;
        quizStreak++;
        if (quizStreak > streakBest) {
          streakBest = quizStreak;
          localStorage.setItem("streakBest", String(streakBest));
        }
        toast(quizStreak >= 3 ? `Streak ${quizStreak} — on fire` : "Nice");
      } else {
        opt.classList.add("wrong");
        quizStreak = 0;
        const right = document.querySelector('.option[data-correct="true"]');
        if (right) right.classList.add("correct");
        toast("Nope — remember that one");
      }
      setTimeout(() => { quizIndex++; showQuestion(); }, 850);
    };
  });
}

function renderProgress() {
  searchWrap.style.display = "none";
  const known = knownIds.size;
  const customCount = customPhrases.length;
  const total = getAllPhrases().length;
  const pct = Math.min(100, Math.round((known / Math.max(total, 1)) * 100));
  main.innerHTML = `
    <div class="panel">
      <h2>Your stats</h2>
      <p class="lead">Known phrases stick. Custom slang counts in Drill.</p>
      <div class="stat-grid">
        <div class="stat"><b>${known}</b><span>Known</span></div>
        <div class="stat"><b>${customCount}</b><span>Custom</span></div>
        <div class="stat"><b>${bestScore}</b><span>Best drill</span></div>
        <div class="stat"><b>${streakBest}</b><span>Best streak</span></div>
      </div>
      <div class="quiz-meta"><span>Banked</span><span>${pct}%</span></div>
      <div class="track"><i style="width:${pct}%"></i></div>
      <div class="btn-row">
        <button type="button" class="btn" id="goDrill">Start Drill</button>
        <button type="button" class="btn ghost" id="clearKnown">Reset known</button>
      </div>
    </div>
  `;
  document.getElementById("goDrill").onclick = () => {
    currentView = "quiz";
    document.querySelectorAll(".nav-btn").forEach(x => x.classList.toggle("on", x.dataset.view === "quiz"));
    startQuiz();
  };
  document.getElementById("clearKnown").onclick = () => {
    knownIds = new Set();
    persistKnown();
    toast("Known list cleared");
    renderProgress();
  };
}

function render() {
  renderTabs();
  if (currentView === "home") renderHome();
  else if (currentView === "quiz") startQuiz();
  else if (currentView === "add") renderAdd();
  else if (currentView === "interpreter") renderInterpreter();
  else if (currentView === "progress") renderProgress();
}

document.querySelectorAll(".nav-btn").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".nav-btn").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    currentView = b.dataset.view;
    currentCat = "all";
    searchEl.value = "";
    render();
  };
});

searchEl.oninput = () => {
  if (currentView === "home") renderHome();
};

render();

if ("serviceWorker" in navigator) {
  // optional future PWA hook — silent if none registered
}
</script>
</body>
</html>
