<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Jerga de obra for construction crews — safety, tools, and unfiltered shop talk with Mexican Spanish audio.">
<title>Jerga de Obra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<meta name="theme-color" content="#FFD100">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0a0a0a;
  --ink-soft: #2e2e2e;
  --muted: #6b6b6b;
  --paper: #ffffff;
  --paper-2: #f2f2f2;
  --steel: #1a1a1a;
  --steel-deep: #000000;
  --blaze: #ffd100;
  --blaze-deep: #e6b800;
  --warn: #ffe566;
  --ok: #1a7a4c;
  --bad: #c1121f;
  --line: rgba(10, 10, 10, 0.14);
  --shadow: 0 12px 28px rgba(10, 10, 10, 0.12);
  --radius: 14px;
  --nav-h: 76px;
  --font-display: "Bebas Neue", Impact, sans-serif;
  --font-body: "Manrope", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(ellipse 120% 80% at 10% -10%, rgba(255, 209, 0, 0.28), transparent 55%),
    radial-gradient(ellipse 90% 60% at 100% 0%, rgba(10, 10, 10, 0.06), transparent 50%),
    linear-gradient(180deg, #ffffff 0%, var(--paper) 45%, #f0f0f0 100%);
  min-height: 100dvh;
  padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 0;
}
.app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; }

/* —— Header / brand —— */
.top {
  padding: 20px 18px 10px;
  animation: rise 0.55s ease both;
}
.brand-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  object-fit: cover;
  border: 2px solid var(--ink);
  box-shadow: 4px 4px 0 var(--blaze);
  flex-shrink: 0;
}
.brand-text h1 {
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 9vw, 3.1rem);
  letter-spacing: 0.03em;
  line-height: 0.9;
  color: var(--ink);
}
.brand-text h1 em {
  font-style: normal;
  color: var(--ink);
  background: var(--blaze);
  padding: 0 0.12em;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.tagline {
  margin-top: 4px;
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--ink-soft);
}
.search-wrap {
  margin-top: 16px;
  position: relative;
}
.search-wrap input {
  width: 100%;
  padding: 14px 16px 14px 44px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: rgba(255,255,255,0.72);
  font: inherit;
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}
.search-wrap input:focus {
  border-color: var(--blaze);
  box-shadow: 0 0 0 3px rgba(255, 209, 0, 0.45);
}
.search-wrap .mag {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  border: 2px solid var(--muted);
  border-radius: 50%;
  pointer-events: none;
}
.search-wrap .mag::after {
  content: "";
  position: absolute;
  width: 8px;
  height: 2px;
  background: var(--muted);
  right: -5px;
  bottom: -1px;
  transform: rotate(45deg);
}

/* —— Category rail —— */
.rail {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 18px 4px;
  scrollbar-width: none;
}
.rail::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  border: 2px solid var(--ink);
  background: rgba(255,255,255,0.55);
  color: var(--ink);
  font: inherit;
  font-weight: 700;
  font-size: 0.82rem;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.12s, background 0.12s, color 0.12s;
}
.chip:active { transform: scale(0.96); }
.chip.on {
  background: var(--ink);
  color: var(--blaze);
}

/* —— Main —— */
main { padding: 12px 18px 24px; }
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 8px 0 14px;
}
.section-head h2 {
  font-family: var(--font-display);
  font-size: 1.7rem;
  letter-spacing: 0.04em;
}
.section-head span {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.cat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 22px;
}
.cat-btn.wide {
  grid-column: 1 / -1;
}
.cat-btn {
  text-align: left;
  border: 2px solid var(--ink);
  background: rgba(255,255,255,0.65);
  border-radius: var(--radius);
  padding: 16px 14px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  animation: rise 0.5s ease both;
}
.cat-btn:nth-child(1) { animation-delay: 0.04s; }
.cat-btn:nth-child(2) { animation-delay: 0.08s; }
.cat-btn:nth-child(3) { animation-delay: 0.12s; }
.cat-btn:nth-child(4) { animation-delay: 0.16s; }
.cat-btn:nth-child(5) { animation-delay: 0.2s; }
.cat-btn:nth-child(6) { animation-delay: 0.24s; }
.cat-btn:nth-child(7) { animation-delay: 0.28s; }
.cat-btn:nth-child(8) { animation-delay: 0.32s; }
.cat-btn:nth-child(9) { animation-delay: 0.36s; }
.cat-btn:hover {
  transform: translateY(-2px);
  box-shadow: 4px 4px 0 var(--blaze);
}
.cat-btn:active { transform: translateY(0); box-shadow: none; }
.cat-btn .mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--blaze);
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: 0.02em;
  margin-bottom: 10px;
}
.cat-btn h3 {
  font-size: 1rem;
  font-weight: 800;
  margin-bottom: 2px;
}
.cat-btn p {
  font-size: 0.78rem;
  color: var(--muted);
  font-weight: 500;
}

.phrase-list { display: flex; flex-direction: column; gap: 10px; }
.phrase {
  border: 2px solid var(--ink);
  background: rgba(255,255,255,0.78);
  border-radius: var(--radius);
  padding: 14px 14px 14px 16px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  align-items: center;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s;
  animation: rise 0.4s ease both;
}
.phrase:active { transform: scale(0.985); }
.phrase.known {
  border-color: var(--ok);
  background: rgba(26, 122, 76, 0.1);
}
.phrase .es {
  font-size: 1.12rem;
  font-weight: 800;
  grid-column: 1;
}
.phrase .en {
  grid-column: 1;
  color: var(--ink-soft);
  font-size: 0.92rem;
  font-weight: 500;
}
.phrase .meta {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.tip {
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 600;
}
.badge {
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 7px;
  border-radius: 6px;
  background: var(--paper-2);
  border: 1px solid var(--line);
}
.badge.mine { background: #fff6bf; border-color: var(--ink); color: var(--ink); }
.badge.hot { background: var(--ink); color: var(--blaze); }
.actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  background: var(--blaze);
  color: var(--ink);
  font-size: 0.75rem;
  font-weight: 800;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: transform 0.12s, background 0.12s;
}
.icon-btn:active { transform: scale(0.9); }
.icon-btn.ghost {
  background: transparent;
  color: var(--ink);
}
.icon-btn.ghost.on {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
}

.empty {
  text-align: center;
  padding: 40px 16px;
  border: 2px dashed var(--ink);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.4);
}
.empty h3 {
  font-family: var(--font-display);
  font-size: 1.8rem;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.empty p { color: var(--muted); font-weight: 600; }

/* —— Panels —— */
.panel {
  border: 2px solid var(--ink);
  background: rgba(255,255,255,0.82);
  border-radius: 18px;
  padding: 22px 18px;
  box-shadow: 6px 6px 0 var(--steel);
  animation: rise 0.45s ease both;
}
.panel.blaze {
  background: linear-gradient(160deg, #fffce6, #ffe566);
  box-shadow: 6px 6px 0 var(--ink);
}
.panel h2 {
  font-family: var(--font-display);
  font-size: 2rem;
  letter-spacing: 0.04em;
  line-height: 1;
  margin-bottom: 6px;
}
.panel .lead {
  color: var(--ink-soft);
  font-weight: 600;
  margin-bottom: 16px;
}
label {
  display: block;
  font-size: 0.75rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin: 12px 0 6px;
}
input[type="text"], select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--ink);
  border-radius: 12px;
  background: #fff;
  font: inherit;
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  outline: none;
}
textarea { resize: vertical; min-height: 88px; }
input:focus, select:focus, textarea:focus {
  border-color: var(--blaze);
  box-shadow: 0 0 0 3px rgba(255, 209, 0, 0.4);
}
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn {
  border: 2px solid var(--ink);
  background: var(--blaze);
  color: var(--ink);
  font: inherit;
  font-weight: 800;
  font-size: 0.95rem;
  padding: 12px 18px;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s;
}
.btn:hover { box-shadow: 3px 3px 0 var(--ink); transform: translateY(-1px); }
.btn:active { transform: none; box-shadow: none; }
.btn.steel { background: var(--ink); color: var(--blaze); }
.btn.ghost { background: transparent; color: var(--ink); }
.status {
  margin-top: 12px;
  font-weight: 700;
  min-height: 1.2em;
}
.status.ok { color: var(--ok); }
.status.bad { color: var(--bad); }

/* —— Quiz —— */
.quiz-prompt {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 7vw, 2.4rem);
  letter-spacing: 0.03em;
  line-height: 1.05;
  margin: 18px 0 8px;
  min-height: 2.2em;
}
.quiz-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}
.track {
  height: 8px;
  background: var(--paper-2);
  border: 2px solid var(--ink);
  border-radius: 999px;
  overflow: hidden;
  margin: 10px 0 4px;
}
.track > i {
  display: block;
  height: 100%;
  background: var(--blaze);
  width: 0%;
  transition: width 0.35s ease;
}
.options { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.option {
  text-align: left;
  border: 2px solid var(--ink);
  background: #fff;
  border-radius: 12px;
  padding: 14px 16px;
  font: inherit;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.12s, background 0.15s, border-color 0.15s;
}
.option:hover:not(:disabled) { transform: translateX(3px); }
.option:disabled {
  opacity: 1;
  color: var(--ink);
}
.option.correct {
  background: rgba(26, 122, 76, 0.18);
  border-color: var(--ok);
  animation: pop 0.35s ease;
}
.option.wrong {
  background: rgba(193, 18, 31, 0.12);
  border-color: var(--bad);
  animation: shake 0.35s ease;
}
.score-big {
  font-family: var(--font-display);
  font-size: 4rem;
  letter-spacing: 0.04em;
  line-height: 1;
  color: var(--ink);
  background: var(--blaze);
  display: inline-block;
  padding: 0.05em 0.2em;
  margin: 12px 0;
}
.streak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  color: var(--ink);
  background: var(--blaze);
  border: 2px solid var(--ink);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.85rem;
}

/* —— Progress —— */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 16px 0;
}
.stat {
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 14px;
  background: #fff;
}
.stat b {
  display: block;
  font-family: var(--font-display);
  font-size: 2.2rem;
  letter-spacing: 0.03em;
  line-height: 1;
  color: var(--blaze);
}
.stat span {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* —— Bottom nav —— */
.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(10px);
  border-top: 2px solid var(--ink);
  display: flex;
  justify-content: space-around;
  padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
  max-width: 520px;
  margin: 0 auto;
}
.nav-btn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 6px 2px;
}
.nav-btn .glyph {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 1rem;
  letter-spacing: 0;
  border: 2px solid transparent;
  transition: all 0.15s;
}
.nav-btn.on { color: var(--ink); }
.nav-btn.on .glyph {
  background: var(--blaze);
  color: var(--ink);
  border-color: var(--ink);
  transform: translateY(-2px);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + 12px);
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--blaze);
  padding: 10px 16px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 80;
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.speak-pulse {
  animation: pulse 0.45s ease;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
@keyframes pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.03); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
@keyframes pulse {
  0% { transform: scale(1); }
  40% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

@media (min-width: 600px) {
  .cat-grid { grid-template-columns: repeat(3, 1fr); }
}

/* —— Flip cards —— */
.mode-switch {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}
.mode-switch button {
  flex: 1;
  border: 2px solid var(--ink);
  background: #fff;
  font: inherit;
  font-weight: 800;
  font-size: 0.82rem;
  padding: 10px 8px;
  border-radius: 12px;
  cursor: pointer;
}
.mode-switch button.on {
  background: var(--blaze);
}
.flip-stage {
  perspective: 1200px;
  min-height: 280px;
  margin: 8px 0 14px;
}
.flip-card {
  position: relative;
  width: 100%;
  min-height: 280px;
  transform-style: preserve-3d;
  transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
  cursor: pointer;
}
.flip-card.show-back { transform: rotateY(180deg); }
.flip-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 3px solid var(--ink);
  border-radius: 18px;
  background: #fff;
  box-shadow: 8px 8px 0 var(--blaze);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 28px 20px;
  gap: 10px;
}
.flip-face.back {
  transform: rotateY(180deg);
  background: linear-gradient(160deg, #fffce6, #ffe566);
  box-shadow: 8px 8px 0 var(--ink);
}
.flip-face .lang {
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.flip-face .big {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 7vw, 2.6rem);
  letter-spacing: 0.03em;
  line-height: 1.05;
}
.flip-face .hint {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ink-soft);
}
.rate-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
}
.rate-row input[type="range"] { flex: 1; accent-color: var(--blaze); }
.custom-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.custom-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 10px 12px;
  background: #fff;
}
.custom-row .txt { font-weight: 700; font-size: 0.9rem; }
.custom-row .txt small { display: block; font-weight: 500; color: var(--muted); }
.danger-btn {
  border: 2px solid var(--ink);
  background: #fff;
  color: var(--bad);
  font: inherit;
  font-weight: 800;
  font-size: 0.75rem;
  padding: 8px 10px;
  border-radius: 10px;
  cursor: pointer;
  white-space: nowrap;
}
.offline-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border: 2px solid var(--ink);
  background: var(--blaze);
  padding: 4px 10px;
  border-radius: 999px;
}

.badge.fav { background: var(--blaze); border-color: var(--ink); color: var(--ink); }
.badge.due { background: #fff; border-color: var(--bad); color: var(--bad); }
.icon-btn.fav.on {
  background: var(--blaze);
  border-color: var(--ink);
  color: var(--ink);
}
.quick-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 0 0 16px;
}
.quick-row .btn { flex: 1; min-width: 120px; font-size: 0.85rem; padding: 12px 10px; }
.onboard {
  position: fixed;
  inset: 0;
  z-index: 90;

      </div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <span class="mag" aria-hidden="true"></span>
      <input type="search" id="search" placeholder="Search jerga, tools, slang…" autocomplete="off" enterkeyhint="search">
    </div>
    <section class="panel translate-box" id="translateBox">
      <h2>Translate</h2>
      <p class="lead">Type any English. We check the crew phrase book first.</p>

      <div class="btn-row">
        <button type="button" class="btn" id="translateBtn">Translate</button>
      </div>
      <p class="translate-note" id="translateHint">Phrase-book matches work offline. A brand-new line needs a signal.</p>
      <div id="translateOut"></div>
    </section>

  <main id="mainContent"></main>

  <button class="nav-btn" data-view="add"><span class="glyph">+</span>Add</button>
  <button class="nav-btn" data-view="progress"><span class="glyph">XP</span>More</button>
</nav>
<div class="toast" id="toast" role="status"></div>
<div class="onboard" id="onboard" hidden></div>

<script src="phrases.js"></script>
<script>

const DATA = window.JERGA_DATA;
const builtInPhrases = DATA.phrases;
const categories = DATA.categories;

const QUIZ_LINES = {
  win: [
    "Foreman material. Filthy and fluent.",
    "You'd survive day one. Mouth and all.",
    "That's jerga. Not Duolingo."
  ],
  mid: [
    "Not bad. Don't freeze when someone yells ¡Aguas, cabrón!",
    "Halfway. Drill the dirty ones before the pour."
  ],
  low: [
    "Rough shift. Hit Safety — and Jerga — again.",
    "Shake it off. Real crews cuss, then they learn."
  ]
};

const ONBOARD_STEPS = [
  {
    title: "Talk like the crew",
    body: "Browse Safety, Tools, Jerga, HVAC — phrases people actually yell, including the filthy ones."
  },
  {
    title: "Hear real Mexican Spanish",
    body: "Tap SAY for Mexican Spanish clips. Flip, Drill both ways, star the keepers — vulgar allowed."
  },
  {
    title: "Review what sticks",
    body: "Mark GOT IT, Review due phrases, add your crew's worst hits. Offline once installed."
  }
];

let customPhrases = safeParse("customPhrases", []);
let knownIds = new Set(safeParse("knownIds", []));
let favoriteIds = new Set(safeParse("favoriteIds", []));
let reviewMap = safeParse("reviewMap", {}); // id -> { due, interval, ease }
let bestScore = Number(localStorage.getItem("bestScore") || 0);
let streakBest = Number(localStorage.getItem("streakBest") || 0);
let speechRate = Number(localStorage.getItem("speechRate") || 0.88);
let quizDirection = localStorage.getItem("quizDirection") || "es-en";
let onboarded = localStorage.getItem("onboarded") === "1";
let onboardStep = 0;

let currentCat = "all";
let currentView = "home";
let quizIndex = 0;
let quizScore = 0;
let quizStreak = 0;
let quizQuestions = [];
let quizMode = "mixed"; // mixed | review | favorites
let cardDeck = [];
let cardIndex = 0;
let cardFlipped = false;
let moreTab = "stats";
let activeAudio = null;

const main = document.getElementById("mainContent");
const tabs = document.getElementById("categoryTabs");
const searchEl = document.getElementById("search");
const searchWrap = document.getElementById("searchWrap");
const translateBox = document.getElementById("translateBox");
const onboardEl = document.getElementById("onboard");

function setBrowsing(on) {
  searchWrap.style.display = on ? "" : "none";
  if (translateBox) translateBox.hidden = !on;
}

function safeParse(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key) || "null");
    return v == null ? fallback : v;
  } catch {
    return fallback;
  }
}

function phraseId(p) {
  return p.id || `${p.cat}::${p.es}::${p.en}`;
}

function getAllPhrases() {
  return [
    ...builtInPhrases.map(p => ({ ...p, custom: false })),
    ...customPhrases.map((p, i) => ({
      ...p,
      id: p.id || `custom-${i}-${(p.es || "").slice(0, 12)}`,
      custom: true
    }))
  ];
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1800);
}

function stopAudio() {
  if (activeAudio) {
    activeAudio.pause();
    activeAudio = null;
  }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}

function speakTTS(text, lang = "es-MX") {
  if (!("speechSynthesis" in window)) {
    toast("Speech not supported on this device");
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = Math.min(1.4, Math.max(0.55, speechRate || 0.88));
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function speak(textOrPhrase, lang = "es-MX") {
  stopAudio();
  const p = typeof textOrPhrase === "object" ? textOrPhrase : null;
  const text = p ? p.es : textOrPhrase;
  const src = p && p.audio ? p.audio : null;
  if (src && lang.startsWith("es")) {
    const audio = new Audio(src);
    audio.playbackRate = Math.min(1.35, Math.max(0.7, speechRate || 0.88));
    activeAudio = audio;
    audio.play().catch(() => speakTTS(text, lang));
    return;
  }
  speakTTS(text, lang);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function persistKnown() {
  localStorage.setItem("knownIds", JSON.stringify([...knownIds]));
}
function persistFavorites() {
  localStorage.setItem("favoriteIds", JSON.stringify([...favoriteIds]));
}
function persistReview() {
  localStorage.setItem("reviewMap", JSON.stringify(reviewMap));
}

function toggleKnown(id) {
  if (knownIds.has(id)) knownIds.delete(id);
  else knownIds.add(id);
  persistKnown();
}

function toggleFavorite(id) {
  if (favoriteIds.has(id)) favoriteIds.delete(id);
  else favoriteIds.add(id);
  persistFavorites();
}

function duePhrases() {
  const now = Date.now();
  return getAllPhrases().filter(p => {
    const r = reviewMap[phraseId(p)];
    return r && r.due <= now;
  });
}

function scheduleReview(id, grade) {
  // grade: "again" | "good" | "easy"
  const now = Date.now();
  const cur = reviewMap[id] || { due: now, interval: 0, ease: 2.3 };
  let interval = cur.interval || 0;
  let ease = cur.ease || 2.3;
  if (grade === "again") {
    interval = 0;
    ease = Math.max(1.3, ease - 0.2);
    cur.due = now + 10 * 60 * 1000; // 10 min
  } else if (grade === "good") {
    interval = interval <= 0 ? 1 : Math.round(interval * ease);
    ease = Math.min(2.8, ease + 0.05);
    cur.due = now + interval * 24 * 60 * 60 * 1000;
  } else {
    interval = interval <= 0 ? 3 : Math.round(interval * ease * 1.3);
    ease = Math.min(3.0, ease + 0.1);
    cur.due = now + interval * 24 * 60 * 60 * 1000;
  }
  cur.interval = interval;
  cur.ease = ease;
  reviewMap[id] = cur;
  persistReview();
}

function renderOnboard() {
  if (onboarded) {
    onboardEl.hidden = true;
    return;
  }
  const step = ONBOARD_STEPS[onboardStep];
  onboardEl.hidden = false;
  onboardEl.innerHTML = `
    <div class="onboard-card" role="dialog" aria-modal="true" aria-label="Welcome">
      <div class="onboard-steps">${ONBOARD_STEPS.map((_, i) =>
        `<span class="${i <= onboardStep ? "on" : ""}"></span>`
      ).join("")}</div>
      <h2>${escapeHtml(step.title)}</h2>
      <p>${escapeHtml(step.body)}</p>
      <div class="btn-row">
        ${onboardStep > 0 ? `<button type="button" class="btn ghost" id="obBack">Back</button>` : `<button type="button" class="btn ghost" id="obSkip">Skip</button>`}
        <button type="button" class="btn" id="obNext">${onboardStep === ONBOARD_STEPS.length - 1 ? "Let's go" : "Next"}</button>
      </div>
    </div>
  `;
  const finish = () => {
    onboarded = true;
    localStorage.setItem("onboarded", "1");
    onboardEl.hidden = true;
  };
  const skip = document.getElementById("obSkip");
  if (skip) skip.onclick = finish;
  const back = document.getElementById("obBack");
  if (back) back.onclick = () => { onboardStep--; renderOnboard(); };
  document.getElementById("obNext").onclick = () => {
    if (onboardStep >= ONBOARD_STEPS.length - 1) finish();
    else { onboardStep++; renderOnboard(); }
  };
}

function renderTabs() {
  if (currentView !== "home") {
    tabs.style.display = "none";
    tabs.innerHTML = "";
    return;
  }
  tabs.style.display = "";
  const items = [{ id: "all", name: "All" }, ...categories];
  tabs.innerHTML = items.map(c =>
    `<button type="button" class="chip ${currentCat === c.id ? "on" : ""}" data-cat="${escapeHtml(c.id)}">${escapeHtml(c.name)}</button>`
  ).join("");
  tabs.querySelectorAll(".chip").forEach(t => {
    t.onclick = () => {
      currentCat = t.dataset.cat;
      render();
    };
  });
}

function imageMeta(p) {
  if (!p || !p.img || !DATA.images) return null;
  return DATA.images[p.img] || null;
}

function imageTag(p, className) {
  const meta = imageMeta(p);
  if (!meta) return "";
  const alt = `${meta.altEn} — ${meta.altEs}`;
  return `<img class="${className}" src="${escapeHtml(meta.src)}" alt="${escapeHtml(alt)}" width="96" height="96">`;
}

function phraseCard(p, i) {
  const id = phraseId(p);
  const known = knownIds.has(id);
  const fav = favoriteIds.has(id);
  const due = reviewMap[id] && reviewMap[id].due <= Date.now();
  const pic = imageTag(p, "pic");
  const badges = [
    p.custom ? `<span class="badge mine">Mine</span>` : "",
    fav ? `<span class="badge fav">★ Fav</span>` : "",
    due ? `<span class="badge due">Due</span>` : "",
    i < 3 && currentCat === "all" ? `<span class="badge hot">Hot</span>` : ""
  ].join("");
  return `
    <article class="phrase ${known ? "known" : ""} ${pic ? "has-pic" : ""}" data-id="${escapeHtml(id)}" style="animation-delay:${Math.min(i, 8) * 0.04}s">
      ${pic}
      <div class="es">${escapeHtml(p.es)}</div>
      <div class="actions">
        <button type="button" class="icon-btn play" data-id="${escapeHtml(id)}" aria-label="Play Spanish">SAY</button>
        <button type="button" class="icon-btn ghost fav ${fav ? "on" : ""}" data-id="${escapeHtml(id)}" aria-label="Favorite">${fav ? "★" : "☆"}</button>
        <button type="button" class="icon-btn ghost mark ${known ? "on" : ""}" data-id="${escapeHtml(id)}" aria-label="Mark known">${known ? "GOT" : "GOT?"}</button>
      </div>
      <div class="en">${escapeHtml(p.en)}</div>
      <div class="meta">
        ${badges}
        ${p.tip ? `<span class="tip">${escapeHtml(p.tip)}</span>` : ""}
      </div>
    </article>
  `;
}

function findById(id) {
  return getAllPhrases().find(p => phraseId(p) === id);
}

function attachPhraseHandlers(root = main) {
  root.querySelectorAll(".play").forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      b.classList.remove("speak-pulse");
      void b.offsetWidth;
      b.classList.add("speak-pulse");
      const p = findById(b.dataset.id);
      if (p) speak(p);
      else speak(b.dataset.text || "");
    };
  });
  root.querySelectorAll(".fav").forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      toggleFavorite(b.dataset.id);
      toast(favoriteIds.has(b.dataset.id) ? "Starred" : "Unstarred");
      if (currentView === "home") renderHome();
      else renderProgress();
    };
  });
  root.querySelectorAll(".mark").forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const id = b.dataset.id;
      const was = knownIds.has(id);
      toggleKnown(id);
      if (!was) scheduleReview(id, "good");
      toast(knownIds.has(id) ? "Marked as known" : "Unmarked");
      if (currentView === "home") renderHome();
      else renderProgress();
    };
  });
}

function filteredPhrases() {
  const all = getAllPhrases();
  let list = currentCat === "all" ? all
    : currentCat === "Custom" ? all.filter(p => p.custom)
    : currentCat === "favorites" ? all.filter(p => favoriteIds.has(phraseId(p)))
    : currentCat === "due" ? duePhrases()
    : all.filter(p => p.cat === currentCat);
  const q = searchEl.value.trim().toLowerCase();
  if (q) {
    list = list.filter(p =>
      p.es.toLowerCase().includes(q) ||
      p.en.toLowerCase().includes(q) ||
      (p.cat || "").toLowerCase().includes(q) ||
      (p.tip || "").toLowerCase().includes(q)
    );
  }
  return list;
}

function renderHome() {
  setBrowsing(true);
  const all = getAllPhrases();
  const results = filteredPhrases();
  const searching = searchEl.value.trim().length > 0;
  const due = duePhrases();
  const favs = all.filter(p => favoriteIds.has(phraseId(p)));

  if (currentCat === "all" && !searching) {
    const popular = all.slice(0, 8);
    main.innerHTML = `
      <div class="quick-row">

function startCards(reshuffle = true) {
  setBrowsing(false);
  let all = getAllPhrases();
  if (quizMode === "favorites") all = all.filter(p => favoriteIds.has(phraseId(p)));
  if (quizMode === "review") {
    const due = duePhrases();
    all = due.length ? due : all;
  }
  if (!all.length) {
    main.innerHTML = `<div class="empty"><h3>No phrases</h3><p>Add some slang or star favorites first.</p></div>`;
    return;
  }
  if (reshuffle || !cardDeck.length) {
    cardDeck = shuffle(all);
    cardIndex = 0;
  }
  cardFlipped = false;
  if (cardIndex >= cardDeck.length) cardIndex = 0;
  showCard();
}

  const p = cardDeck[cardIndex];
  const id = phraseId(p);
  const known = knownIds.has(id);
  const fav = favoriteIds.has(id);
  main.innerHTML = `
    <div class="quiz-meta">
      <span>Card ${cardIndex + 1} / ${cardDeck.length}</span>
      <span>${known ? "Known" : "Learning"}${fav ? " · ★" : ""}</span>
    </div>
    <div class="track"><i style="width:${((cardIndex) / cardDeck.length) * 100}%"></i></div>
    ${imageTag(p, "flip-pic") ? `<div class="flip-visual">${imageTag(p, "flip-pic")}</div>` : ""}
    <div class="flip-stage">

          <div class="lang">Spanish · tap to flip</div>
          <div class="big">${escapeHtml(p.es)}</div>

      <button type="button" class="btn ghost" id="prevCard">Back</button>
      <button type="button" class="btn ghost" id="favCard">${fav ? "Unstar" : "★ Fav"}</button>
      <button type="button" class="btn ghost" id="markCard">${known ? "Unmark" : "Got it"}</button>
      <button type="button" class="btn" id="nextCard">Next</button>
    </div>
    <div class="btn-row">
      <button type="button" class="btn ghost" id="againCard">Again (review)</button>

    cardFlipped = !cardFlipped;
    document.getElementById("flipCard").classList.toggle("show-back", cardFlipped);
  };
  document.getElementById("flipCard").onclick = flip;
  document.getElementById("flipCard").onkeydown = (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
  };
  document.getElementById("flipBtn").onclick = flip;
  document.getElementById("hearCard").onclick = () => speak(p);
  document.getElementById("prevCard").onclick = () => {
    cardIndex = (cardIndex - 1 + cardDeck.length) % cardDeck.length;
    cardFlipped = false;
    showCard();
  };
  document.getElementById("nextCard").onclick = () => {
    cardIndex = (cardIndex + 1) % cardDeck.length;
    cardFlipped = false;
    showCard();
  };
  document.getElementById("favCard").onclick = () => {
    toggleFavorite(id);
    toast(favoriteIds.has(id) ? "Starred" : "Unstarred");

  };
  document.getElementById("markCard").onclick = () => {
    const was = knownIds.has(id);

    cardFlipped = false;

}

function startQuiz(fresh = true) {
  setBrowsing(false);
  let all = getAllPhrases();
  if (quizMode === "favorites") all = all.filter(p => favoriteIds.has(phraseId(p)));
  if (quizMode === "review") {
    const due = duePhrases();
    all = due.length ? due : all.filter(p => !knownIds.has(phraseId(p))).slice(0, 20);
    if (!all.length) all = getAllPhrases();
  }
  if (all.length < 4) {
    main.innerHTML = `<div class="empty"><h3>Need more phrases</h3><p>Add a few, star favorites, or wait for reviews to come due.</p></div>`;
    return;
  }
  if (fresh) {
    quizQuestions = shuffle(all).slice(0, Math.min(10, all.length));
    quizIndex = 0;
    quizScore = 0;
    quizStreak = 0;
  }
  showQuestion();
}

function pickLine(bucket) {
  return bucket[Math.floor(Math.random() * bucket.length)];
}

function showQuestion() {
  if (quizIndex >= quizQuestions.length) {
    if (quizScore > bestScore) {
      bestScore = quizScore;
      localStorage.setItem("bestScore", String(bestScore));
    }
    const ratio = quizScore / quizQuestions.length;
    const line = ratio >= 0.8 ? pickLine(QUIZ_LINES.win)
      : ratio >= 0.5 ? pickLine(QUIZ_LINES.mid)
      : pickLine(QUIZ_LINES.low);
    main.innerHTML = `
      <div class="panel blaze" style="text-align:center;">
        <h2>Shift over</h2>
        <div class="score-big">${quizScore}/${quizQuestions.length}</div>
        <p class="lead">${escapeHtml(line)}</p>
        ${streakBest ? `<p class="streak">Best streak: ${streakBest}</p>` : ""}
        <div class="btn-row" style="justify-content:center;">
          <button type="button" class="btn" id="retryQuiz">Run it back</button>
          <button type="button" class="btn ghost" id="homeAfterQuiz">Home</button>
        </div>
      </div>
    `;
    document.getElementById("retryQuiz").onclick = () => startQuiz(true);
    document.getElementById("homeAfterQuiz").onclick = () => {
      currentView = "home";
      quizMode = "mixed";
      document.querySelectorAll(".nav-btn").forEach(x => x.classList.toggle("on", x.dataset.view === "home"));
      render();
    };
    return;
  }

  const q = quizQuestions[quizIndex];
  const pool = getAllPhrases();
  const esToEn = quizDirection !== "en-es";
  const prompt = esToEn ? q.es : q.en;
  const answer = esToEn ? q.en : q.es;
  const options = [answer];
  let guard = 0;
  while (options.length < 4 && guard++ < 80) {
    const randP = pool[Math.floor(Math.random() * pool.length)];
    const rand = esToEn ? randP.en : randP.es;
    if (!options.includes(rand)) options.push(rand);
  }
  options.sort(() => Math.random() - 0.5);

  main.innerHTML = `
    <div class="panel">
      <div class="mode-switch" role="group" aria-label="Drill mode">
        <button type="button" class="${quizMode === "mixed" ? "on" : ""}" data-mode="mixed">All</button>
        <button type="button" class="${quizMode === "review" ? "on" : ""}" data-mode="review">Review</button>
        <button type="button" class="${quizMode === "favorites" ? "on" : ""}" data-mode="favorites">★ Favs</button>
      </div>
      <div class="mode-switch" role="group" aria-label="Drill direction" style="margin-top:8px;">
        <button type="button" class="${esToEn ? "on" : ""}" data-dir="es-en">ES → EN</button>
        <button type="button" class="${!esToEn ? "on" : ""}" data-dir="en-es">EN → ES</button>
      </div>
      <div class="quiz-meta">
        <span>Q ${quizIndex + 1} / ${quizQuestions.length}</span>
        <span>${quizStreak ? `Streak ${quizStreak}` : "No streak yet"}</span>
      </div>
      <div class="track"><i style="width:${(quizIndex / quizQuestions.length) * 100}%"></i></div>
      ${imageTag(q, "quiz-pic")}
      <div class="quiz-prompt">${escapeHtml(prompt)}</div>
      <p class="lead" style="margin-bottom:0;">${esToEn ? "What does it mean?" : "How do you say it?"}</p>
      <div class="options">
        ${options.map(o =>
          `<button type="button" class="option" data-correct="${o === answer}">${escapeHtml(o)}</button>`
        ).join("")}
      </div>
      <div class="btn-row">
        <button type="button" class="btn ghost" id="hearQ">Hear Spanish</button>
      </div>
    </div>
  `;
  document.querySelectorAll(".mode-switch button[data-mode]").forEach(b => {
    b.onclick = () => {
      quizMode = b.dataset.mode;
      startQuiz(true);
    };
  });
  document.querySelectorAll(".mode-switch button[data-dir]").forEach(b => {
    b.onclick = () => {
      quizDirection = b.dataset.dir;
      localStorage.setItem("quizDirection", quizDirection);
      showQuestion();
    };
  });
  document.getElementById("hearQ").onclick = () => speak(q);
  document.querySelectorAll(".option").forEach(opt => {
    opt.onclick = () => {
      document.querySelectorAll(".option").forEach(o => { o.disabled = true; });
      const correct = opt.dataset.correct === "true";
      const id = phraseId(q);
      if (correct) {
        opt.classList.add("correct");
        quizScore++;
        quizStreak++;
        if (quizStreak > streakBest) {
          streakBest = quizStreak;
          localStorage.setItem("streakBest", String(streakBest));
        }
        scheduleReview(id, "good");
        if (!knownIds.has(id)) {
          knownIds.add(id);
          persistKnown();
        }
        toast(quizStreak >= 3 ? `Streak ${quizStreak} — on fire` : "Nice");
      } else {
        opt.classList.add("wrong");
        quizStreak = 0;
        scheduleReview(id, "again");
        const right = document.querySelector('.option[data-correct="true"]');
        if (right) right.classList.add("correct");
        toast("Nope — back in review soon");
      }
      setTimeout(() => { quizIndex++; showQuestion(); }, 850);
    };
  });
}

const TRANSLATE_STOP = new Set([
  "a", "an", "the", "to", "of", "and", "or", "my", "your", "me", "it", "is", "are",
  "on", "in", "for", "please", "this", "that", "do", "you", "i", "am", "be", "was", "with"
]);
const MATCH_HIGH = 0.62;
const MATCH_CLOSE = 0.42;
let translateSeq = 0;

function normalizeQuery(s) {
  let t = String(s || "").toLowerCase();
  const swaps = [
    [/where's/g, "where is"],
    [/what's/g, "what is"],
    [/that's/g, "that is"],
    [/it's/g, "it is"],
    [/don't/g, "do not"],
    [/can't/g, "cannot"],
    [/won't/g, "will not"],
    [/i'm/g, "i am"],
    [/you're/g, "you are"],
    [/we're/g, "we are"],
    [/they're/g, "they are"],
    [/let's/g, "let us"],
    [/there's/g, "there is"],
    [/who's/g, "who is"]
  ];
  swaps.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return t.replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

function contentTokens(normed) {
  const all = normed.split(" ").filter(Boolean);
  const content = all.filter(w => !TRANSLATE_STOP.has(w));
  return content.length ? content : all;
}

function tokenClose(a, b) {
  if (a === b) return true;
  const vars = (t) => {
    const v = new Set([t]);
    if (t.length > 4 && t.endsWith("s") && !t.endsWith("ss")) v.add(t.slice(0, -1));
    if (t.length > 5 && t.endsWith("es")) v.add(t.slice(0, -2));
    return v;
  };
  const A = vars(a);
  for (const x of vars(b)) if (A.has(x)) return true;
  return false;
}

function tokenOverlap(a, b) {
  const used = new Set();
  let n = 0;
  for (const t of a) {
    const i = b.findIndex((u, idx) => !used.has(idx) && tokenClose(t, u));
    if (i >= 0) { used.add(i); n++; }
  }
  return n;
}

function matchScore(query, phraseEn) {
  const qn = normalizeQuery(query);
  const pn = normalizeQuery(phraseEn);
  if (!qn || !pn) return 0;
  if (qn === pn) return 1;
  const qt = contentTokens(qn);
  const pt = contentTokens(pn);
  if (!qt.length || !pt.length) return 0;
  const inter = tokenOverlap(qt, pt);
  if (!inter) return 0;
  const union = qt.length + pt.length - inter;
  const jaccard = union ? inter / union : 0;
  const coverage = inter / qt.length;
  const phraseCov = inter / pt.length;
  let bonus = 0;
  if (pn.includes(qn) || qn.includes(pn)) bonus = 0.15;
  else if (inter === pt.length) bonus = 0.12;
  return Math.min(1, jaccard * 0.45 + coverage * 0.4 + phraseCov * 0.15 + bonus);
}

function rankBuiltIn(query) {
  return builtInPhrases
    .map(p => ({ p, score: matchScore(query, p.en) }))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score || a.p.en.length - b.p.en.length);
}

function usableTranslation(text) {
  if (!text) return false;
  const t = String(text).trim();
  if (!t) return false;
  if (/MYMEMORY WARNING/i.test(t)) return false;
  if (/QUERY LENGTH LIMIT/i.test(t)) return false;
  if (/INVALID LANGUAGE PAIR/i.test(t)) return false;
  return true;
}

async function fetchMyMemory(query, pair) {
  const url = "https://api.mymemory.translated.net/get?q="
    + encodeURIComponent(query)
    + "&langpair=" + encodeURIComponent(pair);
  const res = await fetch(url);
  if (!res.ok) throw new Error(String(res.status));
  const data = await res.json();
  if (data && data.responseStatus && Number(data.responseStatus) !== 200) {
    throw new Error("status");
  }
  const text = data && data.responseData && data.responseData.translatedText;
  return text ? String(text).trim() : "";
}

function spanishVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = speechSynthesis.getVoices() || [];
  return voices.find(v => /^es[-_]MX/i.test(v.lang))
    || voices.find(v => /^es([-_]|$)/i.test(v.lang))
    || null;
}

function speakMachineSpanish(text) {
  if (!("speechSynthesis" in window)) {
    toast("Speech isn't available on this phone");
    return;
  }
  let started = false;
  const talk = () => {
    if (started) return;
    started = true;
    stopAudio();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "es-MX";
    const voice = spanishVoice();
    if (voice) {
      try { u.voice = voice; } catch (_) { /* lang es-MX still applies */ }
    }
    u.rate = Math.min(1.4, Math.max(0.55, speechRate || 0.88));
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  };
  if ((speechSynthesis.getVoices() || []).length) {
    talk();
    return;
  }
  const onVoices = () => {
    speechSynthesis.removeEventListener("voiceschanged", onVoices);
    talk();
  };
  speechSynthesis.addEventListener("voiceschanged", onVoices);
  setTimeout(talk, 350);
}

function suggestionButtons(list) {
  if (!list.length) return "";
  return `
    <p class="translate-kicker">Close suggestions</p>
    <div class="suggest-list">
      ${list.map(p => `
        <button type="button" class="suggest" data-id="${escapeHtml(phraseId(p))}">
          ${escapeHtml(p.es)}
          <small>${escapeHtml(p.en)}</small>
        </button>
      `).join("")}
    </div>
  `;
}

function saveTranslateFields() {
  const esEl = document.getElementById("translateEs");
  const enEl = document.getElementById("translateEn");
  const status = document.getElementById("translateStatus");
  const es = esEl ? esEl.value.trim() : "";
  const en = enEl ? enEl.value.trim() : "";
  if (!es || !en) {
    if (status) {
      status.textContent = "Need both Spanish and English.";
      status.className = "status bad";
    }
    return;
  }
  customPhrases.push({
    id: `custom-${Date.now()}`,
    cat: "Custom",
    es,
    en
  });
  localStorage.setItem("customPhrases", JSON.stringify(customPhrases));
  if (status) {
    status.textContent = "Saved to My Phrases.";
    status.className = "status ok";
  }
  toast("Saved to My Phrases");
}

function showBookHit(phrase, suggestions, english) {
  const out = document.getElementById("translateOut");
  const pic = imageTag(phrase, "hit-pic");
  out.innerHTML = `
    <p class="translate-kicker">From the phrase book</p>
    <div class="translate-main">
      ${pic}
      <div>
        <div class="es">${escapeHtml(phrase.es)}</div>
        <div class="en">${escapeHtml(phrase.en)}</div>
        ${phrase.tip ? `<div class="tip">${escapeHtml(phrase.tip)}</div>` : ""}
      </div>
    </div>
    <div class="btn-row">
      <button type="button" class="btn" id="playMatch">Hear Spanish</button>
    </div>
    <label for="translateEs">Spanish — edit it before you save</label>
    <input id="translateEs" type="text" value="${escapeHtml(phrase.es)}">
    <label for="translateEn">English</label>
    <input id="translateEn" type="text" value="${escapeHtml(english)}">
    <div class="btn-row">
      <button type="button" class="btn steel" id="saveTranslate">Save to My Phrases</button>
    </div>
    <p class="status" id="translateStatus"></p>
    ${suggestionButtons(suggestions)}
  `;
  document.getElementById("playMatch").onclick = () => speak(phrase);
  document.getElementById("saveTranslate").onclick = saveTranslateFields;
  out.querySelectorAll(".suggest").forEach(btn => {
    btn.onclick = () => {
      const next = builtInPhrases.find(p => phraseId(p) === btn.dataset.id);
      if (!next) return;
      const rest = [phrase, ...suggestions].filter(p => phraseId(p) !== phraseId(next)).slice(0, 2);
      showBookHit(next, rest, english);
    };
  });
}

function showMachineHit(spanish, english, note) {
  const out = document.getElementById("translateOut");
  out.innerHTML = `
    ${note ? `<p class="status bad" id="translateMsg">${escapeHtml(note)}</p>` : ""}
    ${spanish ? `
      <p class="translate-kicker machine">Machine translation, may not be jobsite slang</p>
      <div class="translate-main"><div class="es" id="machineLine">${escapeHtml(spanish)}</div></div>
      <div class="btn-row">
        <button type="button" class="btn" id="speakTranslate">Speak</button>
      </div>
      <label for="translateEs">Spanish — edit it before you save</label>
      <input id="translateEs" type="text" value="${escapeHtml(spanish)}">
      <label for="translateEn">English</label>
      <input id="translateEn" type="text" value="${escapeHtml(english)}">
      <div class="btn-row">
        <button type="button" class="btn steel" id="saveTranslate">Save to My Phrases</button>
      </div>
      <p class="status" id="translateStatus"></p>
    ` : ""}
  `;
  const speakBtn = document.getElementById("speakTranslate");
  if (speakBtn) {
    speakBtn.onclick = () => {
      const text = document.getElementById("translateEs").value.trim();
      if (!text) {
        toast("Add Spanish first");
        return;
      }
      speakMachineSpanish(text);
    };
  }
  const saveBtn = document.getElementById("saveTranslate");
  if (saveBtn) saveBtn.onclick = saveTranslateFields;
}

async function runTranslate() {
  const input = document.getElementById("translateInput");
  const btn = document.getElementById("translateBtn");
  const out = document.getElementById("translateOut");
  const query = input.value.trim();
  if (!query) {
    out.innerHTML = `<p class="status bad">Type an English phrase first.</p>`;
    return;
  }
  if (query.length > 400) {
    out.innerHTML = `<p class="status bad">That's too long. Try a shorter line.</p>`;
    return;
  }
  const seq = ++translateSeq;
  const ranked = rankBuiltIn(query);
  const top = ranked[0];
  if (top && top.score >= MATCH_HIGH) {
    const suggestions = ranked.slice(1).filter(x => x.score >= MATCH_CLOSE).slice(0, 2).map(x => x.p);
    showBookHit(top.p, suggestions, query);
    return;
  }
  btn.disabled = true;
  const oldLabel = btn.textContent;
  btn.textContent = "Working…";
  out.innerHTML = `<p class="translate-note">Checking for a translation…</p>`;
  const offlineMsg = "New phrases need a signal. The phrase book still matches while you're offline.";
  const failMsg = "Couldn't reach the translator. New phrases need a signal. The phrase book still works offline.";
  try {
    if (!navigator.onLine) {
      if (seq !== translateSeq) return;
      showMachineHit("", query, offlineMsg);
      return;
    }
    let spanish = "";
    try {
      spanish = await fetchMyMemory(query, "en|es-MX");
      if (!usableTranslation(spanish)) spanish = "";
    } catch {
      spanish = "";
    }
    if (!spanish) {
      try {
        spanish = await fetchMyMemory(query, "en|es");
      } catch {
        spanish = "";
      }
    }
    if (seq !== translateSeq) return;
    if (!usableTranslation(spanish)) {
      showMachineHit("", query, failMsg);
      return;
    }
    showMachineHit(spanish, query, "");
  } catch {
    if (seq === translateSeq) showMachineHit("", query, failMsg);
  } finally {
    if (seq === translateSeq) {
      btn.disabled = false;
      btn.textContent = oldLabel;
    }
  }
}

function mountTranslate() {
  const input = document.getElementById("translateInput");
  const btn = document.getElementById("translateBtn");
  if (!input || !btn) return;
  const go = () => runTranslate();
  btn.onclick = go;
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      go();
    }
  });
}

function render() {
  renderTabs();
  if (currentView === "home") renderHome();
  else if (currentView === "cards") startCards(true);
  else if (currentView === "quiz") startQuiz(true);
  else if (currentView === "add") renderAdd();
  else if (currentView === "progress") renderProgress();
}

document.querySelectorAll(".nav-btn").forEach(b => {
  b.onclick = () => {
    stopAudio();
    const toastEl = document.getElementById("toast");
    toastEl.classList.remove("show");
    clearTimeout(toast._t);
    document.querySelectorAll(".nav-btn").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    currentView = b.dataset.view;
    currentCat = "all";
    if (currentView !== "quiz" && currentView !== "cards") quizMode = "mixed";
    searchEl.value = "";
    render();
  };
});

searchEl.oninput = () => {
  if (currentView === "home") renderHome();
};

mountTranslate();
if ("speechSynthesis" in window) speechSynthesis.getVoices();

render();
renderOnboard();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

</script>
